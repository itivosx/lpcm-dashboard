name: Sync LPCM Dashboard

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 GMT-3 = 09:00 UTC, diário
  workflow_dispatch: {}     # botão "Run workflow" manual, equivalente ao "Run now"

permissions:
  contents: write           # necessário pra commitar o index.html

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "lpcm-sync-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
